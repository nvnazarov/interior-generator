[project]
name = "exporter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "functools2>=0.1.1",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=4.0.0",
    "reportlab>=4.4.9",
    "types-reportlab>=4.4.10.20260402",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "isort>=8.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = "ignore:.*wait_container_is_ready decorator is deprecated.*:DeprecationWarning"
markers = [
    "unit: marks tests as unit tests (fast, lightweight)",
    "integration: marks tests as integration tests (slow)",
]

[tool.isort]
profile = "black"
