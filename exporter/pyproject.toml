[project]
name = "exporter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.4.3",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.6.0",
    "reportlab>=4.4.9",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = ["asgi-lifespan>=2.1.0", "pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"
