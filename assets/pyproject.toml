[project]
name = "assets"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.1",
    "minio>=7.2.20",
    "pydantic-settings>=2.13.1",
    "python-json-logger>=4.0.0",
    "python-multipart>=0.0.22",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: marks tests as unit tests (fast, lightweight)",
    "integration: marks tests as integration tests (slow)",
]

[tool.isort]
profile = "black"
