events {
}

http {
    log_format debug '$request $account_id';
    access_log /var/log/nginx/access.log debug;

    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://127.0.0.1:3000" $http_origin;
    }

    upstream projects {
        server projects:80;
    }
    upstream exporter {
        server exporter:80;
    }
    upstream generator {
        server generator:80;
    }
    upstream catalog {
        server catalog:80;
    }
    upstream auth {
        server auth:80;
    }
    upstream minio {
        server minio:9000;
    }
    upstream assets {
        server assets:80;
    }
    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        location = /_auth {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://auth/api/me;
        }

        # Account management.
        location /api/auth/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            proxy_pass http://auth;
        }

        # Object storage.
        location /assets/ {
            proxy_pass http://minio;
            rewrite ^/assets(/.*)?$ $1 break;
        }
        location /api/assets/ {
            proxy_pass http://assets;
            rewrite ^/api/assets(/.*)?$ $1 break;
        }

        # Catalog service.
        location /api/catalog {
            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://catalog;
            rewrite ^/api/catalog(/.*)?$ $1 break;
        }

        # Exporter service.
        location ~ ^/api/projects/([0-9A-Za-z\-]+)/export/pdf$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://exporter;
            rewrite ^/api(/.*)?$ $1 break;
        }
        location ~ ^/api/plans/([0-9A-Za-z\-]+)/export/dxf$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://exporter;
            rewrite ^/api(/.*)?$ $1 break;
        }

        # Projects service.
        location = /api/projects {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://projects;
            rewrite ^/api(/.*)?$ $1 break;
        }
        location ~ ^/api/projects/([0-9A-Za-z\-])+(/publish|/unpublish|/plans)?$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://projects;
            rewrite ^/api(/.*)?$ $1 break;
        }
        location ~ ^/api/plans/([0-9A-Za-z\-]+)$ {
            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://projects;
            rewrite ^/api(/.*)?$ $1 break;
        }

        # Generator service.
        location ~ ^/api/projects/([0-9A-Za-z\-])+/plans/generate$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_auth;
            auth_request_set $account_id $upstream_http_x_account_id;
            proxy_set_header x-account-id $account_id;
            proxy_pass http://generator;
            rewrite ^/api(/.*)?$ $1 break;
        }

        # Frontend.
        location /app {
            if ($request_uri = /app) {
                return 301 $scheme://$http_host/app/;
            }
            proxy_pass http://frontend;
        }
        location = / {
            return 301 http://$http_host/app;
        }
    }
}