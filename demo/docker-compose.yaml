services:
  public-gateway:
    image: "nginx:1.29"
    volumes:
      - "./nginx.public.conf:/etc/nginx/nginx.conf"
    ports:
      - "8080:80"
    networks:
      - "private"
    depends_on:
      auth:
        condition: "service_healthy"
      catalog:
        condition: "service_healthy"
      generator:
        condition: "service_healthy"
      exporter:
        condition: "service_healthy"
      projects:
        condition: "service_healthy"
      assets:
        condition: "service_healthy"
  
  private-gateway:
    image: "nginx:1.29"
    volumes:
      - "./nginx.private.conf:/etc/nginx/nginx.conf"
    networks:
      - "private"
    depends_on:
      auth:
        condition: "service_healthy"
      catalog:
        condition: "service_healthy"
      generator:
        condition: "service_healthy"
      exporter:
        condition: "service_healthy"
      projects:
        condition: "service_healthy"
      assets:
        condition: "service_healthy"

  postgres:
    image: "postgres"
    volumes:
      - "postgres:/var/lib/postgresql"
    environment:
      - "POSTGRES_DB=postgres"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
    networks:
      - "private"
    healthcheck:
      test: "pg_isready -U postgres"
      interval: "10s"
      timeout: "5s"
      retries: 3

  minio:
    image: "quay.io/minio/minio"
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      - "MINIO_ROOT_USER=user"
      - "MINIO_ROOT_PASSWORD=password"
    ports:
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # Web UI
    volumes:
      - "minio:/data"
    networks:
      - "private"
    healthcheck:
      test: "curl -fsS http://localhost:9000/minio/health/live >/dev/null"
      interval: "10s"
      timeout: "5s"
      retries: 3

  elastic:
    image: "docker.elastic.co/elasticsearch/elasticsearch:9.3.2"
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
    mem_limit: "2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - "elastic:/usr/share/elasticsearch/data"
    networks:
      - "private"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9200/_cluster/health?local=true",
        ]
      interval: "30s"
      timeout: "10s"
      retries: 3

  auth:
    build:
      context: "../auth"
      dockerfile: "../auth/docker/Dockerfile.${MOD:-dev}"
    environment:
      - "APP_PORT=80"
      - "APP_POSTGRES__HOST=postgres"
      - "APP_POSTGRES__PORT=5432"
      - "APP_POSTGRES__DB=postgres"
      - "APP_POSTGRES__USER=postgres"
      - "APP_POSTGRES__PASSWORD=postgres"
      - "BETTER_AUTH_BASE_URL=http://localhost:8080"
      - "BETTER_AUTH_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:8080"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  catalog:
    build:
      context: "../catalog"
      dockerfile: "../catalog/docker/Dockerfile.${MOD:-dev}"
    environment:
      - "CATALOG__API__HOST=0.0.0.0"
      - "CATALOG__API__PORT=80"
      - "CATALOG__ELASTIC__HOST=http://elastic:9200"
      - "CATALOG__ELASTIC__INDEX=catalog"
      - "CATALOG__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3
    depends_on:
      elastic:
        condition: "service_healthy"

  generator:
    build:
      context: "../generator"
      dockerfile: "../generator/docker/Dockerfile.${MOD:-dev}"
    environment:
      - "GENERATOR__API__HOST=0.0.0.0"
      - "GENERATOR__API__PORT=80"
      - "GENERATOR__API__HEADER_FOR_ACCOUNT_ID=x-account-id"
      - "GENERATOR__OPENAI__API_KEY=${GENERATOR__OPENAI__API_KEY}"
      - "GENERATOR__OPENAI__BASE_URL=${GENERATOR__OPENAI__BASE_URL}"
      - "GENERATOR__POSTGRES__HOST=postgres"
      - "GENERATOR__POSTGRES__PORT=5432"
      - "GENERATOR__POSTGRES__USER=postgres"
      - "GENERATOR__POSTGRES__PASSWORD=postgres"
      - "GENERATOR__POSTGRES__DB=postgres"
      - "GENERATOR__GATEWAY__BASE_URL=http://private-gateway/api"
      - "GENERATOR__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  exporter:
    build:
      context: "../exporter"
      dockerfile: "../exporter/docker/Dockerfile.${MOD:-dev}"
    environment:
      - "EXPORTER__API__HOST=0.0.0.0"
      - "EXPORTER__API__PORT=80"
      - "EXPORTER__API__HEADER_FOR_ACCOUNT_ID=x-account-id"
      - "EXPORTER__API_GATEWAY__BASE_URL=http://projects"
      - "EXPORTER__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  projects:
    build:
      context: "../projects"
      dockerfile: "../projects/docker/Dockerfile.${MOD:-dev}"
    environment:
      - "PROJECTS__API__HOST=0.0.0.0"
      - "PROJECTS__API__PORT=80"
      - "PROJECTS__API__HEADER_FOR_ACCOUNT_ID=x-account-id"
      - "PROJECTS__GENERAL__PLANS_LIMIT=20"
      - "PROJECTS__GENERAL__PROJECTS_LIMIT=20"
      - "PROJECTS__POSTGRES__HOST=postgres"
      - "PROJECTS__POSTGRES__PORT=5432"
      - "PROJECTS__POSTGRES__USER=postgres"
      - "PROJECTS__POSTGRES__PASSWORD=postgres"
      - "PROJECTS__POSTGRES__DB=postgres"
      - "PROJECTS__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3
    depends_on:
      postgres:
        condition: "service_healthy"

  assets:
    build:
      context: "../assets"
      dockerfile: "../assets/docker/Dockerfile.${MOD:-dev}"
    environment:
      - "ASSETS__API__HOST=0.0.0.0"
      - "ASSETS__API__PORT=80"
      - "ASSETS__MINIO__HOST=minio"
      - "ASSETS__MINIO__PORT=9000"
      - "ASSETS__MINIO__ACCESS_KEY=user"
      - "ASSETS__MINIO__SECRET_KEY=password"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3
    depends_on:
      minio:
        condition: "service_healthy"

  frontend:
    build:
      context: "../frontend"
      dockerfile: "../frontend/docker/Dockerfile.${MOD:-dev}"
    volumes:
      - "../frontend/src:/app/src"
    environment:
      - "FRONTEND__API__HOST=0.0.0.0"
      - "FRONTEND__API__PORT=80"
      - "FRONTEND__API_GATEWAY__BASE_URL=http://localhost:8080"
      - "FRONTEND__PROXY__BASE_PATH=/app"
    networks:
      - "private"

networks:
  private: {}

volumes:
  postgres: {}
  minio: {}
  elastic: {}
