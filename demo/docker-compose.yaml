services:
  public-gateway:
    image: "nginx:1.29"
    volumes:
      - "./nginx.public.conf:/etc/nginx/nginx.conf"
    ports:
      - "8080:80"
    networks:
      - "private"
    depends_on:
      auth:
        condition: "service_healthy"
      catalog:
        condition: "service_healthy"
      generator:
        condition: "service_healthy"
      exporter:
        condition: "service_healthy"
      projects:
        condition: "service_healthy"
      assets:
        condition: "service_healthy"

  private-gateway:
    image: "nginx:1.29"
    volumes:
      - "./nginx.private.conf:/etc/nginx/nginx.conf"
    networks:
      - "private"
    depends_on:
      auth:
        condition: "service_healthy"
      catalog:
        condition: "service_healthy"
      generator:
        condition: "service_healthy"
      exporter:
        condition: "service_healthy"
      projects:
        condition: "service_healthy"
      assets:
        condition: "service_healthy"

  postgres:
    image: "postgres"
    volumes:
      - "postgres:/var/lib/postgresql"
    environment:
      - "POSTGRES_DB=${POSTGRES__DB?}"
      - "POSTGRES_USER=${POSTGRES__USER?}"
      - "POSTGRES_PASSWORD=${POSTGRES__PASSWORD?}"
    networks:
      - "private"
    healthcheck:
      test: "pg_isready -U ${POSTGRES__USER?}"
      interval: "10s"
      timeout: "5s"
      retries: 3

  minio:
    image: "quay.io/minio/minio"
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      - "MINIO_ROOT_USER=${MINIO__USER?}"
      - "MINIO_ROOT_PASSWORD=${MINIO__PASSWORD?}"
    volumes:
      - "minio:/data"
    networks:
      - "private"
    healthcheck:
      test: "curl -fsS http://localhost:9000/minio/health/live >/dev/null"
      interval: "10s"
      timeout: "5s"
      retries: 3

  elastic:
    image: "docker.elastic.co/elasticsearch/elasticsearch:9.3.2"
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
    mem_limit: "2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - "elastic:/usr/share/elasticsearch/data"
    networks:
      - "private"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9200/_cluster/health?local=true",
        ]
      interval: "30s"
      timeout: "10s"
      retries: 3

  auth:
    build:
      context: "../auth"
      dockerfile: "../auth/docker/Dockerfile.${MOD?}"
    environment:
      - "AUTH__API__HOST=0.0.0.0"
      - "AUTH__API__PORT=80"
      - "AUTH__POSTGRES__HOST=postgres"
      - "AUTH__POSTGRES__PORT=5432"
      - "AUTH__POSTGRES__USER=${POSTGRES__USER?}"
      - "AUTH__POSTGRES__PASSWORD=${POSTGRES__PASSWORD?}"
      - "AUTH__POSTGRES__DB=${POSTGRES__DB?}"
      - "AUTH__BETTER_AUTH__SECRET=${AUTH__BETTER_AUTH__SECRET?}"
      - "AUTH__BETTER_AUTH__BASE_URL=${AUTH__BETTER_AUTH__BASE_URL?}"
      - "AUTH__BETTER_AUTH__TRUSTED_ORIGINS=${AUTH__BETTER_AUTH__TRUSTED_ORIGINS?}"
    networks:
      - "private"
    depends_on:
      migrate-auth:
        condition: "service_completed_successfully"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  migrate-auth:
    build:
      context: "../auth"
      dockerfile: "../auth/docker/Dockerfile.dev"
    command: ["make", "migrate"]
    environment:
      - "AUTH__POSTGRES__HOST=postgres"
      - "AUTH__POSTGRES__PORT=5432"
      - "AUTH__POSTGRES__USER=${POSTGRES__USER?}"
      - "AUTH__POSTGRES__PASSWORD=${POSTGRES__PASSWORD?}"
      - "AUTH__POSTGRES__DB=${POSTGRES__DB?}"
      - "AUTH__BETTER_AUTH__SECRET=${AUTH__BETTER_AUTH__SECRET?}"
      - "AUTH__BETTER_AUTH__BASE_URL=${AUTH__BETTER_AUTH__BASE_URL?}"
      - "AUTH__BETTER_AUTH__TRUSTED_ORIGINS=${AUTH__BETTER_AUTH__TRUSTED_ORIGINS?}"
    networks:
      - "private"
    depends_on:
      postgres:
        condition: "service_healthy"

  catalog:
    build:
      context: "../catalog"
      dockerfile: "../catalog/docker/Dockerfile.${MOD?}"
    environment:
      - "CATALOG__API__HOST=0.0.0.0"
      - "CATALOG__API__PORT=80"
      - "CATALOG__ELASTIC__HOST=http://elastic:9200"
      - "CATALOG__ELASTIC__INDEX=catalog"
      - "CATALOG__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3
    depends_on:
      elastic:
        condition: "service_healthy"

  generator:
    build:
      context: "../generator"
      dockerfile: "../generator/docker/Dockerfile.${MOD?}"
    environment:
      - "GENERATOR__API__HOST=0.0.0.0"
      - "GENERATOR__API__PORT=80"
      - "GENERATOR__API__ACCOUNT_HEADER=x-account-id"
      - "GENERATOR__OPENAI__API_KEY=${GENERATOR__OPENAI__API_KEY?}"
      - "GENERATOR__OPENAI__BASE_URL=${GENERATOR__OPENAI__BASE_URL?}"
      - "GENERATOR__POSTGRES__HOST=postgres"
      - "GENERATOR__POSTGRES__PORT=5432"
      - "GENERATOR__POSTGRES__USER=${POSTGRES__USER?}"
      - "GENERATOR__POSTGRES__PASSWORD=${POSTGRES__PASSWORD?}"
      - "GENERATOR__POSTGRES__DB=${POSTGRES__DB?}"
      - "GENERATOR__GATEWAY__BASE_URL=http://private-gateway/api"
      - "GENERATOR__LOGGING__LEVEL=DEBUG"
    networks:
      - "private"
    depends_on:
      migrate-generator:
        condition: "service_completed_successfully"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  migrate-generator:
    build:
      context: "../generator"
      dockerfile: "../generator/docker/Dockerfile.dev"
    command: ["make", "migrate"]
    environment:
      - "GENERATOR__POSTGRES__HOST=postgres"
      - "GENERATOR__POSTGRES__PORT=5432"
      - "GENERATOR__POSTGRES__USER=${POSTGRES__USER?}"
      - "GENERATOR__POSTGRES__PASSWORD=${POSTGRES__PASSWORD?}"
      - "GENERATOR__POSTGRES__DB=${POSTGRES__DB?}"
    networks:
      - "private"
    depends_on:
      postgres:
        condition: "service_healthy"

  exporter:
    build:
      context: "../exporter"
      dockerfile: "../exporter/docker/Dockerfile.${MOD?}"
    environment:
      - "EXPORTER__API__HOST=0.0.0.0"
      - "EXPORTER__API__PORT=80"
      - "EXPORTER__API__ACCOUNT_HEADER=x-account-id"
      - "EXPORTER__GATEWAY__BASE_URL=http://private-gateway/api"
      - "EXPORTER__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  projects:
    build:
      context: "../projects"
      dockerfile: "../projects/docker/Dockerfile.${MOD?}"
    environment:
      - "PROJECTS__API__HOST=0.0.0.0"
      - "PROJECTS__API__PORT=80"
      - "PROJECTS__API__ACCOUNT_HEADER=x-account-id"
      - "PROJECTS__GENERAL__PLANS_LIMIT=20"
      - "PROJECTS__GENERAL__PROJECTS_LIMIT=20"
      - "PROJECTS__POSTGRES__HOST=postgres"
      - "PROJECTS__POSTGRES__PORT=5432"
      - "PROJECTS__POSTGRES__USER=${POSTGRES__USER?}"
      - "PROJECTS__POSTGRES__PASSWORD=${POSTGRES__PASSWORD?}"
      - "PROJECTS__POSTGRES__DB=${POSTGRES__DB?}"
      - "PROJECTS__LOGGING__LEVEL=INFO"
    networks:
      - "private"
    depends_on:
      migrate-projects:
        condition: "service_completed_successfully"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3

  migrate-projects:
    build:
      context: "../projects"
      dockerfile: "../projects/docker/Dockerfile.dev"
    command: ["make", "migrate"]
    environment:
      - "PROJECTS__POSTGRES__HOST=postgres"
      - "PROJECTS__POSTGRES__PORT=5432"
      - "PROJECTS__POSTGRES__USER=${POSTGRES__USER?}"
      - "PROJECTS__POSTGRES__PASSWORD=${POSTGRES__PASSWORD?}"
      - "PROJECTS__POSTGRES__DB=${POSTGRES__DB?}"
    networks:
      - "private"
    depends_on:
      postgres:
        condition: "service_healthy"

  assets:
    build:
      context: "../assets"
      dockerfile: "../assets/docker/Dockerfile.${MOD?}"
    environment:
      - "ASSETS__API__HOST=0.0.0.0"
      - "ASSETS__API__PORT=80"
      - "ASSETS__MINIO__HOST=minio"
      - "ASSETS__MINIO__PORT=9000"
      - "ASSETS__MINIO__ACCESS_KEY=${MINIO__USER?}"
      - "ASSETS__MINIO__SECRET_KEY=${MINIO__PASSWORD?}"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: "15s"
      timeout: "5s"
      retries: 3
    depends_on:
      minio:
        condition: "service_healthy"

  frontend:
    build:
      context: "../frontend"
      dockerfile: "../frontend/docker/Dockerfile.${MOD?}"
    volumes:
      - "../frontend/src:/app/src"
    environment:
      - "FRONTEND__API__HOST=0.0.0.0"
      - "FRONTEND__API__PORT=80"
      - "FRONTEND__API_GATEWAY__BASE_URL=${FRONTEND__API_GATEWAY__BASE_URL?}"
      - "FRONTEND__PROXY__BASE_PATH=/app"
    networks:
      - "private"

networks:
  private: {}

volumes:
  postgres: {}
  minio: {}
  elastic: {}
