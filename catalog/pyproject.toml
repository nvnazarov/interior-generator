[project]
name = "catalog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.5",
    "elasticsearch>=9.3.0",
    "fastapi>=0.128.0",
    "psycopg[binary]>=3.3.2",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=4.0.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.1",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "testcontainers[postgres]>=4.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = "ignore:.*wait_container_is_ready decorator is deprecated.*:DeprecationWarning"
markers = [
    "unit: marks tests as unit tests (fast, lightweight)",
    "integration: marks tests as integration tests (slow)",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[tool.isort]
profile = "black"
