[project]
name = "projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.121.3",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "alembic>=1.17.2",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgres]>=4.13.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = "ignore:.*wait_container_is_ready decorator is deprecated.*:DeprecationWarning"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
