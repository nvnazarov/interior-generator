[project]
name = "projects"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.121.3",
    "psycopg[binary]>=3.3.2",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=4.0.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.3",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "isort>=8.0.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "testcontainers[postgres]>=4.13.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = "ignore:.*wait_container_is_ready decorator is deprecated.*:DeprecationWarning"
markers = [
    "unit: marks tests as unit tests (fast, lightweight)",
    "integration: marks tests as integration tests (slow)",
    "project: marks tests that test operations on projects",
    "plan: marks tests that test operations on plans",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[tool.isort]
profile = "black"
